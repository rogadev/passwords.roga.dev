name: PR Source Guard

# Enforces the branch policy: pull requests into `main` may only come from `dev`.
# This runs as a required status check, so a PR from any other branch cannot merge.

on:
  pull_request:
    branches: [ main ]

jobs:
  verify-source:
    name: Verify PR source is dev
    runs-on: ubuntu-latest
    steps:
      - name: Check head branch is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs into main must originate from 'dev' (got '${{ github.head_ref }}')."
            exit 1
          fi
          echo "Source branch is 'dev'. ✓"
