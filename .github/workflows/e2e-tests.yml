name: End-to-End Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        
      - name: Run unit tests
        run: pnpm test
        
      - name: Build app
        run: pnpm build
        
      - name: Start server and run E2E tests
        run: |
          # Find an available port
          PORT=$(node -e "const net=require('net');const srv=net.createServer();srv.listen(0,()=>{const port=srv.address().port;console.log(port);srv.close()});")
          echo "Using port: $PORT"
          
          # Start server with dynamic port
          pnpm preview --port $PORT &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 5
          
          # Run tests with the dynamic port
          PLAYWRIGHT_TEST_BASE_URL=http://localhost:$PORT pnpm test:e2e
          
          # Kill the server process afterward
          kill $SERVER_PID || true
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
